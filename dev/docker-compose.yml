# Local WordPress for manual and E2E testing: http://localhost:8080 (admin / admin).
# The plugin folder is mounted read-write at wp-content/plugins/seo-console.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    tmpfs: /var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/seo-console
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
  cli:
    image: wordpress:cli-php8.3
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/seo-console
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["wp"]
    profiles: ["cli"]
volumes:
  wp:
